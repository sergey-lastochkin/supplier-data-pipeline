[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-data-pipeline"
version = "0.1.0"
description = "Resilient supplier ingestion and canonicalization pipeline with incremental state, drift detection, matching, deltas, and recovery semantics."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<0.29",
    "pydantic>=2,<3",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.30,<0.35",
]

[project.optional-dependencies]
playwright = ["playwright>=1.50,<2"]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
